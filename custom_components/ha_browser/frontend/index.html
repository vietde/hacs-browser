<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Browser</title>
<link rel="stylesheet" href="/api/ha_browser/assets/style.css">
</head>
<body>
<div class="bar" id="topbar">
  <button id="btn-back" title="Back">&#8592;</button>
  <button id="btn-forward" title="Forward">&#8594;</button>
  <button id="btn-reload" title="Reload">&#8635;</button>
  <button id="btn-home" title="Home">&#8962;</button>
  <input id="address" type="text" placeholder="Search or type a web address"
         autocomplete="off" autocapitalize="off" spellcheck="false">
  <button id="btn-go" title="Go">&#10148;</button>
  <span id="blocked" class="pill" title="Ads and trackers blocked on this page">&#128683; 0 blocked</span>
</div>
<div class="view">
  <iframe id="frame" title="Browser" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
  <div id="overlay" class="overlay hidden">
    <div class="overlay-card">
      <div id="overlay-text">Loading&hellip;</div>
    </div>
  </div>
</div>
<script src="/api/ha_browser/assets/app.js"></script>
<script>
  // Homepage is injected by the server (config entry option).
  window.HA_BROWSER_HOMEPAGE = "__HOMEPAGE__";
</script>
</body>
</html>
